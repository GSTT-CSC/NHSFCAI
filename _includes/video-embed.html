{% comment %}
  Responsive YouTube embed. The raw <iframe width="560"> overflowed on any
  screen narrower than 560px.

    {% include video-embed.html id="SsONx1jAGxE" title="..." %}

<div class="video-embed">

          title="{{ include.title }}"
          loading="lazy"
          allow="picture-in-picture"
          allowfullscreen></iframe>
</div>
