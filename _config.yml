url: 'https://www.nhsfellowship.ai'
baseurl: ''
permalink: pretty
title: 'NHS Fellowship in Clinical AI'

# Current cohort dates, used across the site as {{ site.fellowship_start }}
# and {{ site.fellowship_end }}.
fellowship_start: 11 August 2027
fellowship_end: 10 August 2028

logo:
  mobile: "/images/logo/fcai_logo.png"
  mobile_height: "32px"
  mobile_width: "90px"
  desktop: "/images/logo/fcai_logo.png"
  desktop_height: "32px"
  desktop_width: "90px"

collections:
  team:
    output: true
  fellow:
    output: true
  faculty:
    output: true

defaults:

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
